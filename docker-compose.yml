version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: sdecombats-nginx
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/sdecombats
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - sdecombats-network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdecombats-php
    volumes:
      - .:/var/www/sdecombats
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sdc_db
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sdecombats-network

  mysql:
    image: mysql:8.0
    container_name: sdecombats-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sdc_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdecombats-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sdecombats-phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sdecombats-network

networks:
  sdecombats-network:
    driver: bridge

volumes:
  mysql-data:
